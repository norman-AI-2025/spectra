<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="spectraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Bento App Icon Surface -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#spectraGrad)" />
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Academic Prism & Spectral Refraction Geometry -->
  <g transform="translate(64, 64)">
    <!-- Subtle background concentric rays -->
    <circle r="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle r="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

    <!-- Prism equilateral outline -->
    <polygon points="0,-32 30,24 -30,24" fill="rgba(255,255,255,0.12)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />

    <!-- Inner Core & Refraction Spark -->
    <path d="M-22,12 L0,-24 L22,12" fill="none" stroke="url(#beamGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
    
    <!-- Central Spectrum Star / Aperture -->
    <circle cx="0" cy="4" r="5" fill="#FFFFFF" />
    <polygon points="0,-6 2,0 8,4 2,8 0,14 -2,8 -8,4 -2,0" fill="#38BDF8" opacity="0.9" />
  </g>
</svg>
